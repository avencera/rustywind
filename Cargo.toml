[workspace]
members = ["rustywind-cli", "rustywind-core", "rustywind-vite", "xtask"]
default-members = ["rustywind-cli"]
resolver = "2"

[workspace.package]
authors = ["Praveen Perera <praveen@avencera.com>"]
edition = "2024"
license = "Apache-2.0"
homepage = "https://github.com/avencera/rustywind"
repository = "https://github.com/avencera/rustywind"

[workspace.dependencies]
once_cell = "1.20"
quick_cache = "0.7"
compact_str = "0.10"

# hashmap
# Lowest common denominator: the `runtime-rng` default needs getrandom, which doesn't build
# on wasm32-unknown-unknown. Members that want stock ahash re-enable default features.
ahash = { version = "0.8", default-features = false, features = ["std", "no-rng"] }

# errors
eyre = "0.6"
color-eyre = "0.6"

# logging
env_logger = "0.11"
log = "0.4"

# regex
regex = "1.11"

[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = true

[profile.profiling]
inherits = "release"
debug = true
strip = false
