[package]
name = "xtask"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }

# error handling
color-eyre = { workspace = true }

# regex parsing
regex = { workspace = true }

# parallel execution
rayon = "1.10"

# command execution
duct = "1.1"

# progress bars
indicatif = "0.18"

# binary checking
which = "8"

# CPU count detection
num_cpus = "1"

# random seed generation
rand = "0.10"

# JSON serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.11"

# timestamp generation
chrono = "0.4"

# npm binary handling
flate2 = "1"
tar = "0.4"
zip = "8"
ureq = "3"
